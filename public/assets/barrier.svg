<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonStripes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff00aa" />
      <stop offset="50%" stop-color="#aa00ff" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>
  </defs>
  <!-- Tall solid barrier that you must jump over -->
  <rect x="10" y="10" width="80" height="90" fill="url(#neonStripes)" stroke="#ff00aa" stroke-width="4" />
  <!-- Diagonal hazard lines -->
  <line x1="10" y1="30" x2="90" y2="10" stroke="#fff" stroke-width="2" opacity="0.5" />
  <line x1="10" y1="50" x2="90" y2="30" stroke="#fff" stroke-width="2" opacity="0.5" />
  <line x1="10" y1="70" x2="90" y2="50" stroke="#fff" stroke-width="2" opacity="0.5" />
  <line x1="10" y1="90" x2="90" y2="70" stroke="#fff" stroke-width="2" opacity="0.5" />
  <!-- Floating hologram warning text (simulated) -->
  <text x="50" y="55" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">JUMP</text>
</svg>
